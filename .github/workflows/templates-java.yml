name: Templates · Java

# Both templates target JDK 17. Spring Boot's suite runs for real; JavaFX only
# compiles, because its tests want a display server and a headless runner has
# none — a job that spun up Xvfb would be testing Xvfb, not lattice.
#
# android-compose is deliberately absent. It needs the Android SDK and a Gradle
# wrapper, and Gradle's wrapper has no script-only form — shipping one means
# committing gradle-wrapper.jar, which STRUCTURE.md refuses. A job that generated
# a wrapper just to have something to run would be testing Gradle, not lattice.
#
# The Maven templates DO ship a wrapper now, in Maven's script-only distribution:
# mvnw resolves Maven itself, so there is no jar. That closes a gap these jobs
# could not see — `actions/setup-java` puts Maven on PATH, so CI built the
# templates happily while anyone without a global Maven got nothing at all. The
# `wrapper` job below therefore runs with no Maven installed, which is the only
# configuration that actually tests what the wrapper is for.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: templates-java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template:
    name: ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: spring-boot
            check: mvn -B test
          - stack: javafx
            check: mvn -B -DskipTests package
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # No --database here: these stacks reject it. Their storage is fixed by the
      # template, and the CLI errors out rather than silently ignoring the flag.
      # Both checks run without a live database, so nothing needs starting.
      - run: node bin/lattice.js demo --stack ${{ matrix.stack }} --package at.htlvillach.demo --no-database-start
      - working-directory: demo
        run: ${{ matrix.check }}

  # `mvn test` is not evidence that the application runs.
  #
  # The Spring test profile uses H2 with flyway.enabled=false, so the suite never
  # loads a PostgreSQL driver and never executes a migration. That is a reasonable
  # thing for a unit suite to do, and it meant a green build sat on top of an
  # application that could not start: Flyway 10 moved per-database support out of
  # flyway-core, and without flyway-database-postgresql it connects, fails with
  # "Unsupported Database: PostgreSQL", and dies during context initialisation.
  #
  # Every test passed. `mvn spring-boot:run` — the command the CLI prints as the
  # next step — crashed. So this job runs that command instead of trusting the
  # tests, against the real PostgreSQL the CLI starts itself, and asks the only
  # question that matters: does the thing boot, and do its probes answer?
  boots:
    name: spring-boot boots against a real PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - run: node bin/lattice.js demo --stack spring-boot --package at.htlvillach.demo --no-database-start

      # The CLI ships a compose file for Spring but does not start it — unlike the
      # storage-picker stacks, this one has no live storage spec for the CLI to act
      # on, so bringing PostgreSQL up is a documented step the README prints. This
      # runs that step. `--wait` blocks until the healthcheck passes, so the app is
      # not raced against a database that is still initialising.
      - name: Start the database the template ships
        working-directory: demo
        run: docker compose up -d --wait database

      - name: Boot it, and probe what a load balancer would probe
        working-directory: demo
        run: |
          mvn -B spring-boot:run > boot.log 2>&1 &

          for _ in $(seq 1 90); do
            curl -fsS http://localhost:3000/api/health/liveness >/dev/null 2>&1 && break
            sleep 2
          done

          if ! curl -fsS http://localhost:3000/api/health/liveness >/dev/null 2>&1; then
            echo "::error::The scaffolded Spring Boot application never came up."
            cat boot.log
            exit 1
          fi

          # Flyway really ran, the entity really validated, the database is really
          # reachable — readiness is the one probe that can only answer 200 if all
          # three are true.
          echo "liveness:  $(curl -fsS http://localhost:3000/api/health/liveness)"
          echo "readiness: $(curl -fsS http://localhost:3000/api/health/readiness)"

  # No `mvn` on PATH, on purpose. setup-java installs a JDK but this job never
  # asks for Maven, so the only way the build can succeed is the wrapper doing its
  # job: resolving and running Maven itself. That is precisely the situation the
  # bug was reported from, and the one every other job here hides.
  wrapper:
    name: ${{ matrix.stack }} · no global Maven
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [spring-boot, javafx]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: node bin/lattice.js demo --stack ${{ matrix.stack }} --package at.htlvillach.demo --no-database-start

      - name: The wrapper is there and executable
        run: |
          test -x demo/mvnw || { echo "::error::demo/mvnw is missing or not executable"; exit 1; }
          test -f demo/.mvn/wrapper/maven-wrapper.properties || { echo "::error::no wrapper properties"; exit 1; }
          # The binary this project refuses to ship. If it ever appears, someone ran
          # `mvn wrapper:wrapper` without the script-only type.
          ! find demo -name '*.jar' -print -quit | grep -q . || { echo "::error::a wrapper jar was scaffolded"; exit 1; }

      # The ubuntu runner image preinstalls Maven whether or not setup-java asks for
      # it, so without this the wrapper is never exercised and the job proves
      # nothing. The runner is ephemeral; removing it affects this job only.
      - name: Take Maven off PATH
        run: |
          while command -v mvn >/dev/null; do sudo rm -f "$(command -v mvn)"; done
          if command -v mvn >/dev/null; then
            echo "::error::mvn is still on PATH — this job cannot prove anything"
            exit 1
          fi
          echo "no mvn on PATH — the wrapper is now the only way to build"

      - name: Build with the wrapper, with Maven absent
        working-directory: demo
        run: ./mvnw -B ${{ matrix.stack == 'spring-boot' && 'test' || 'compile' }}
