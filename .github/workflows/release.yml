name: Release

# Step two of two. `prepare-release.yml` has already bumped the version and cut the
# changelog through a reviewed pull request; this publishes what is on main.
#
#   you publish a GitHub Release with the tag vX.Y.Z
#        |
#        v
#   verify        the full unit matrix runs again, on the code being shipped
#        |
#        v
#   refuse        ...if the tag is not main's HEAD, if package.json disagrees with
#                 the tag, if CHANGELOG.md has no section for it, or if the version
#                 is already on npm. All BEFORE anything is published.
#        |
#        v
#   approve       a human approves the `production` environment. This is the last
#                 point at which the release can still be stopped.
#        |
#        v
#   publish       npm publish --provenance  ->  create-lattice@X.Y.Z
#        |
#        v
#   record        a separate job sets the Release body to the notes already in
#                 the changelog — see the comment on that job for why it is separate
#
# WHY THE PUBLISH JOB WRITES NOTHING
# This workflow used to stamp the version, publish, and then push the version
# commit to main. Two things were wrong with that. main is now governed by the
# `main-protection` ruleset and CI cannot push through it — GitHub will not let the
# Actions app bypass a ruleset on a user-owned repository, and no repository-role
# bypass exempts github-actions[bot]; both were tested and both fail with GH013.
#
# More importantly, that push happened *after* `npm publish`. A failure in it left
# a version on a registry that never forgets and no record of it on main. Moving
# the bump into a reviewed pull request beforehand removes the window rather than
# working around it: by the time this workflow runs, main already carries the
# version and its notes, so there is nothing left to write back.
#
# What was a mutation is now an assertion. Instead of setting package.json from the
# tag, this refuses to publish if the two disagree — which catches a Release cut
# from the wrong commit, the case the old stamping quietly papered over.
#
# No npm secret required: publishing is OpenID Connect (trusted publishing), so
# npm trusts this workflow directly — nothing to store, leak, or rotate. The trust
# is configured once on npmjs.org: create-lattice -> Settings -> Trusted Publisher
# -> this repository, workflow release.yml.

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same matrix a pull request runs — not a copy of it. See unit.yml.
  verify:
    name: Verify
    uses: ./.github/workflows/unit.yml

  publish:
    name: Publish create-lattice
    needs: verify
    runs-on: ubuntu-latest
    # The approval gate. `npm publish` is the one step in this repository that
    # cannot be undone — a version on the registry can never be replaced — so it
    # waits for a human. The environment's required reviewer is asked only after
    # `verify` is green, which means the question being approved is "ship this
    # tested code", not "start a build and hope".
    #
    # Deliberately not on `github-packages`: that job is the cosmetic badge copy
    # described below, and gating it would mean approving the same release twice.
    environment: production
    permissions:
      # read, not write: this workflow no longer commits anything. The version and
      # the changelog reached main through the reviewed release pull request.
      contents: read
      id-token: write # mints the OIDC token that signs the npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag, not main: what gets published must be exactly what was
          # tagged. The step below then refuses if that is not also main's HEAD.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1 for the OIDC
          # exchange. node 24 clears the Node floor; the upgrade below clears the npm
          # one regardless of what npm this runner image happens to ship with.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure an OIDC-capable npm
        run: npm install --global npm@latest

      - name: Derive the version from the tag
        id: v
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          # A tag that is not a semver number would otherwise sail through and
          # produce a nonsense npm version. Refuse it here.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not a semver version (expected vX.Y.Z)."
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The Release must be cut from main's HEAD. If it is not, everything
      # downstream is quietly wrong: the tests would run against one tree and npm
      # would receive another under this version number. And npm does not take it
      # back. Rather than guess which is meant, refuse.
      - name: Refuse a Release cut from anything but main's HEAD
        run: |
          git fetch --quiet origin main
          tagged="$(git rev-parse HEAD)"
          head="$(git rev-parse origin/main)"

          if [ "$tagged" != "$head" ]; then
            echo "::error::${{ steps.v.outputs.tag }} points at $tagged, but main is at $head."
            echo "::error::Publishing would ship the wrong tree as ${{ steps.v.outputs.tag }}. Delete the Release and the tag, then cut it again from main's HEAD."
            exit 1
          fi

      # This is the assertion that replaced the old stamping step. package.json is
      # set by the release pull request, so if it disagrees with the tag then the
      # Release was cut from the wrong commit, or the preparation was never merged.
      # Stamping it here would have hidden exactly that.
      - name: Refuse a tag that disagrees with package.json
        run: |
          declared="$(node -p "require('./package.json').version")"
          if [ "$declared" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::package.json says $declared but the tag says ${{ steps.v.outputs.version }}."
            echo "::error::Run the Prepare release workflow for ${{ steps.v.outputs.version }} and merge its pull request before cutting the Release."
            exit 1
          fi

      # npm would reject the duplicate anyway, but only after this job had run.
      - name: Refuse a version that is already on npm
        run: |
          if npm view "create-lattice@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::create-lattice@${{ steps.v.outputs.version }} is already published. A version on npm can never be replaced — cut the next one."
            exit 1
          fi

      # Not the notes themselves — just proof they exist, before anything is
      # published. The notes are written to the Release page by the `notes` job
      # below, which needs a permission this job deliberately does not have.
      - name: Refuse a version the changelog has no section for
        run: node scripts/release-changelog.js --notes "${{ steps.v.outputs.version }}" > /dev/null

      # No token: authentication is OpenID Connect. The id-token: write permission
      # above lets this job mint a short-lived OIDC token; npm exchanges it for a
      # one-time publish credential, and the trusted publisher configured on
      # npmjs.org (create-lattice -> this repo -> release.yml) is what makes npm
      # trust it. Nothing is stored — there is no NPM_TOKEN to leak or rotate.
      - name: Publish to npm (trusted publishing — no token)
        run: npm publish --provenance --access public

  # Writing the Release body needs `contents: write`, which the publish job above
  # deliberately does not have — so it is a separate job.
  #
  # Splitting it is not only about least privilege. It is the one step that runs
  # *after* the irreversible publish, and when it failed on the v1.1.0 release the
  # whole workflow could not simply be re-run: the second attempt would have been
  # refused by "this version is already on npm", correctly. As its own job it can be
  # re-run on its own from the failed run, which is what you actually want at that
  # point. Nothing here touches npm, so re-running it is free.
  notes:
    name: Put the notes on the Release page
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release edit — the Release body, nothing else
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Put the changelog's notes on the Release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"

          # Read, not written: the release pull request already cut this section and
          # it was reviewed. The Release page and the changelog therefore say the
          # same thing because they are the same text, rather than because someone
          # pasted carefully. GitHub's auto-generated notes — a list of pull request
          # titles, internal ones included — are what this replaces.
          node scripts/release-changelog.js --notes "${tag#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md"

  # A second, deliberately cosmetic publish, so the repository shows a Packages
  # entry. It is NOT how anyone installs the tool: GitHub Packages only accepts
  # scoped, lowercase names and makes callers authenticate even for public packages,
  # so `npm create lattice@latest` keeps coming from npmjs.org (the publish job
  # above). This copy is @wolfi-owo/create-lattice, published purely for the badge.
  #
  # It hangs off `publish`, not `verify`. It used to be the other way round, on the
  # reasoning that the two registries are independent so the badge should appear
  # even if the npm publish is held up. That reasoning was wrong, and v2.0.0 is how
  # it showed: the Release was cut before the version bump had merged, `publish`
  # correctly refused it — "package.json says 1.1.0 but the tag says 2.0.0" — and
  # this job published anyway, because it inherits none of those checks. Three
  # attempted releases each republished here while npm was correctly refusing all
  # three, so GitHub Packages ended up serving 1.1.0's code labelled 2.0.0. The
  # fourth attempt, the correct one, then failed with 409: the version was taken.
  #
  # Depending on `publish` is what makes that impossible. Everything guarding the
  # npm publish — the tag is main's HEAD, package.json agrees with the tag, the
  # changelog has a section, and a human approved the production environment — now
  # guards this too, by construction rather than by restating them here.
  #
  # Auth is the built-in GITHUB_TOKEN — no secret to manage.
  github-packages:
    name: Publish @wolfi-owo/create-lattice to GitHub Packages
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the package to the repository's GitHub Packages
    steps:
      - uses: actions/checkout@v7
        # The tag, like the publish job. This job hangs off `verify` rather than
        # `publish`, so it must not quietly ship main's HEAD under the tag's number
        # if the two ever differ.

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Derive the version from the tag
        id: v
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not a semver version (expected vX.Y.Z)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # GitHub Packages rejects both the unscoped name and npmjs.org provenance, so
      # the package is re-badged here: scoped to the owner and lowercased, provenance
      # dropped, registry pointed at GitHub. None of this is committed — it exists
      # only in this runner, for this one publish. The real create-lattice on npm is
      # never modified.
      - name: Re-badge for GitHub Packages
        run: |
          npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg set name='@wolfi-owo/create-lattice'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'

      # Skipped rather than failed when the version is already there. This job is
      # the cosmetic half of a release, and re-running a workflow whose npm publish
      # succeeded should not go red over a package that is already correct — a 409
      # here means "already done", not "broken".
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@wolfi-owo/create-lattice@${{ steps.v.outputs.version }}" version \
               --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::notice::@wolfi-owo/create-lattice@${{ steps.v.outputs.version }} is already on GitHub Packages — nothing to do."
            exit 0
          fi
          npm publish
