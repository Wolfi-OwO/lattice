name: Release

# Releases are made by hand, on purpose.
#
#   you bump the version in package.json  ->  commit  ->  push
#   you draft a Release on GitHub with the tag vX.Y.Z and publish it
#        |
#        v
#   this workflow  ->  guard (tag == package.json version?)
#                  ->  test
#                  ->  npm publish --provenance
#
# Nothing here writes to the repository, so no bot ever appears in the history
# or the contributor list. The only thing automation does is verify and ship.
#
# A Release published by a *person* does trigger workflows — GitHub's recursion
# guard only suppresses events for releases created by GITHUB_TOKEN. So this
# needs no PAT.
#
# Required once: NPM_TOKEN (an npm automation token) in the repository secrets.

on:
  release:
    types: [published]
  # Lets you re-run a publish that failed on a flaky network without cutting a
  # new release. Pass the tag that already exists, e.g. v1.0.1.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.1"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token that signs the npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the tag itself, not the branch tip: main may already have
          # moved on, and the thing being published must be the thing tagged.
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # The tag and package.json are two places recording the same number, and
      # they drift the moment a release is cut by hand. Publishing 1.0.0 under
      # the tag v1.0.1 is silent and permanent — npm will not let you re-publish
      # that version. So fail here, loudly, before anything is shipped.
      - name: Tag must match package.json version
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          pkg="v$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $tag does not match package.json ($pkg). Bump the version, or retag."
            exit 1
          fi

      # Lattice has no dependencies, so there is nothing to install first.
      - name: Test before shipping
        run: node --test "tests/*.test.js"

      # --provenance publishes a signed, verifiable link back to this exact
      # workflow run and commit, so anyone installing create-lattice can confirm
      # the tarball was built from this repository and not from someone's laptop.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
