name: Release

# Day to day you just commit and merge PRs to main. Nothing here fires, and
# nothing writes to the repository.
#
# Creating a *tag* on its own also does nothing — deliberately. The trigger is
# publishing a **Release**:
#
#   you publish a GitHub Release with the tag vX.Y.Z
#        |
#        v
#   verify        the full unit matrix runs again, on the code being shipped
#        |
#        v
#   refuse        ...if the version is already on npm, or if CHANGELOG.md has
#                 nothing under [Unreleased]. Both checks run BEFORE anything is
#                 written anywhere.
#        |
#        v
#   stamp         package.json is set to X.Y.Z, and CHANGELOG.md's [Unreleased]
#                 section becomes "## [X.Y.Z] - <today>" with a fresh empty
#                 [Unreleased] left above it for the next change
#        |
#        v
#   publish       npm publish --provenance  ->  create-lattice@X.Y.Z
#        |
#        v
#   record        the version + changelog commit lands on main AS YOU, the tag is
#                 moved onto it, and the Release body is set to the notes that
#                 just went into the changelog
#
# WHY THE ORDER IS TEST -> REFUSE -> STAMP -> PUBLISH -> COMMIT
# npm is the irreversible step: a published version can never be republished. So
# nothing is written anywhere until the suite is green, and main is only written
# *after* npm has accepted the tarball. main therefore records versions that
# genuinely shipped, and a failed release leaves the branch untouched rather than
# carrying a version that does not exist on the registry.
#
# The changelog is *checked* before the publish and *cut* before the publish, but
# only *committed* after it. Checking early is the whole point: if "you forgot to
# write the release notes" were discovered after `npm publish`, the tarball would
# already be on a registry that never forgets, and the file that records what is
# in it would be the thing that failed. So it fails while failing is still free.
#
# WHY NO BOT APPEARS IN THE HISTORY
# The commit's author is whatever `git config user.name/user.email` says — the
# token only authorises the *push*. Setting them to you means the version commit
# is authored by you and shows your profile, using the built-in GITHUB_TOKEN.
# No PAT to create, no secret to rotate, and github-actions[bot] never lands in
# the contributor list. The email below must be one verified on your GitHub
# account, or the commit will show as an unattributed author instead of you.
#
# No npm secret required: publishing is OpenID Connect (trusted publishing), so
# npm trusts this workflow directly — nothing to store, leak, or rotate. The trust
# is configured once on npmjs.org: create-lattice -> Settings -> Trusted Publisher
# -> this repository, workflow release.yml.
# If main is protected against direct pushes, allow this workflow to bypass it,
# or the version commit cannot land.

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same matrix a pull request runs — not a copy of it. See unit.yml.
  verify:
    name: Verify
    uses: ./.github/workflows/unit.yml

  publish:
    name: Publish create-lattice
    needs: verify
    runs-on: ubuntu-latest
    # The approval gate. `npm publish` is the one step in this repository that
    # cannot be undone — a version on the registry can never be replaced — so it
    # waits for a human. The environment's required reviewer is asked only after
    # `verify` is green, which means the question being approved is "ship this
    # tested code", not "start a build and hope".
    #
    # Deliberately not on `github-packages`: that job is the cosmetic badge copy
    # described below, and gating it would mean approving the same release twice.
    environment: production
    permissions:
      contents: write # push the version commit and move the tag
      id-token: write # mints the OIDC token that signs the npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # The version commit has to land on main, so check out the branch
          # rather than the detached tag.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1 for the OIDC
          # exchange. node 24 clears the Node floor; the upgrade below clears the npm
          # one regardless of what npm this runner image happens to ship with.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure an OIDC-capable npm
        run: npm install --global npm@latest

      - name: Derive the version from the tag
        id: v
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          # A tag that is not a semver number would otherwise sail through and
          # produce a nonsense npm version. Refuse it here.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not a semver version (expected vX.Y.Z)."
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The checkout above is `main`, but the Release was cut from a *tag*. If
      # those two are not the same commit, everything downstream is quietly wrong:
      # the tests would run against main, the tarball would be built from main, and
      # npm would receive main's code under the tag's version number — a published
      # vX.Y.Z whose contents were never the thing anyone tagged. And npm does not
      # take it back.
      #
      # Rather than guess which of the two is meant, refuse. Cutting a Release from
      # main's HEAD is the only workflow this repository has, so a mismatch is not
      # an exotic configuration — it is main having moved on while the Release was
      # being drafted, which is exactly the case that must not publish.
      - name: Refuse a Release cut from anything but main's HEAD
        run: |
          tagged="${{ github.sha }}"
          head="$(git rev-parse HEAD)"

          if [ "$tagged" != "$head" ]; then
            echo "::error::${{ steps.v.outputs.tag }} points at $tagged, but main is at $head."
            echo "::error::Publishing would ship main's code as ${{ steps.v.outputs.tag }}. Delete the Release and the tag, then cut it again from main's HEAD."
            exit 1
          fi
          echo "main and ${{ steps.v.outputs.tag }} are the same commit ($head)."

      # npm would reject the duplicate anyway, but it would do so *after* the
      # release had already been cut and half this job had run. Failing here says
      # plainly what went wrong: that version is already gone, pick the next one.
      - name: Refuse a version that is already on npm
        run: |
          version="${{ steps.v.outputs.version }}"
          if npm view "create-lattice@$version" version >/dev/null 2>&1; then
            echo "::error::create-lattice@$version is already published. A version on npm can never be replaced — cut the next one."
            exit 1
          fi

      # Fails while failing is still free — see the header. After `npm publish`
      # this same discovery would be unfixable.
      - name: Refuse a release with no notes
        run: node scripts/release-changelog.js --check

      # Every file that records the version is rewritten from the tag, so the tag
      # is the single source of truth and they cannot drift apart. package.json is
      # the only file that carries the number today — the CLI's `--version` reads it
      # from there rather than keeping a second copy, which is why there is no third
      # place to update. Add further files here if that ever changes; they stay in
      # the one commit below.
      - name: Set the version everywhere
        run: npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version

      # [Unreleased] becomes "## [X.Y.Z] - <today>", and a fresh empty [Unreleased]
      # is left above it. The notes are written to a file rather than a step output
      # because they are multi-line prose — a heredoc delimiter is one stray line in
      # someone's changelog away from mangling the workflow. It lands in RUNNER_TEMP,
      # outside the checkout, so it cannot be swept into the commit below.
      - name: Write the changelog
        id: changelog
        run: |
          node scripts/release-changelog.js \
            --version "${{ steps.v.outputs.version }}" \
            --date "$(date -u +%Y-%m-%d)" \
            > "$RUNNER_TEMP/release-notes.md"
          echo "--- notes ---"
          cat "$RUNNER_TEMP/release-notes.md"

      # No token: authentication is OpenID Connect. The id-token: write permission
      # above lets this job mint a short-lived OIDC token; npm exchanges it for a
      # one-time publish credential, and the trusted publisher configured on
      # npmjs.org (create-lattice -> this repo -> release.yml) is what makes npm
      # trust it. Nothing is stored — there is no NPM_TOKEN to leak or rotate.
      #
      # Provenance is automatic under trusted publishing; the flag is redundant but
      # harmless and keeps the intent explicit — a signed, verifiable link back to
      # this exact run and commit, so anyone installing create-lattice can confirm
      # the tarball was built here and not on someone's laptop. The tarball ships the
      # finished CHANGELOG.md, version already cut.
      - name: Publish to npm (trusted publishing — no token)
        run: npm publish --provenance --access public

      # Only now — the registry has the tarball, so main can safely say so.
      - name: Record the version and the changelog on main, as me
        run: |
          # Authorship comes from these two lines, not from the token. This is
          # what keeps github-actions[bot] out of the contributor list.
          git config user.name  "Wolfi-OwO"
          git config user.email "koflerphillip@outlook.com"

          # package.json (the number) and CHANGELOG.md (what changed) are one
          # commit on purpose: a version that shipped and the notes saying what
          # was in it are the same fact, and splitting them lets one land without
          # the other.
          if git diff --quiet; then
            echo "Already at ${{ steps.v.outputs.version }} — nothing to commit."
          else
            git commit -am "chore(release): ${{ steps.v.outputs.tag }}"
            git push origin main
          fi

          # The Release was cut from the commit *before* the version bump, so its
          # tag still points there. Move the tag onto the commit that actually
          # carries the version that was published — otherwise `git checkout vX.Y.Z`
          # hands you a tree whose package.json disagrees with the release.
          git tag -f "${{ steps.v.outputs.tag }}"
          git push --force origin "refs/tags/${{ steps.v.outputs.tag }}"

      # The Release page and the changelog now say the same thing because they are
      # the same text, not because someone pasted it into both.
      - name: Put the notes on the Release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.v.outputs.tag }}" --notes-file "$RUNNER_TEMP/release-notes.md"

  # A second, deliberately cosmetic publish, so the repository shows a Packages
  # entry. It is NOT how anyone installs the tool: GitHub Packages only accepts
  # scoped, lowercase names and makes callers authenticate even for public packages,
  # so `npm create lattice@latest` keeps coming from npmjs.org (the publish job
  # above). This copy is @wolfi-owo/create-lattice, published purely for the badge.
  #
  # It hangs off `verify`, not `publish`, on purpose: the two registries are
  # independent, so the badge appears even if the npm publish is held up (e.g. a
  # token being rotated). Auth is the built-in GITHUB_TOKEN — no secret to manage.
  github-packages:
    name: Publish @wolfi-owo/create-lattice to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the package to the repository's GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Derive the version from the tag
        id: v
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$tag' is not a semver version (expected vX.Y.Z)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # GitHub Packages rejects both the unscoped name and npmjs.org provenance, so
      # the package is re-badged here: scoped to the owner and lowercased, provenance
      # dropped, registry pointed at GitHub. None of this is committed — it exists
      # only in this runner, for this one publish. The real create-lattice on npm is
      # never modified.
      - name: Re-badge for GitHub Packages
        run: |
          npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg set name='@wolfi-owo/create-lattice'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
