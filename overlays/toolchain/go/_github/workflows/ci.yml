name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Lets a release pipeline reuse this exact suite as its test stage, so a release
  # ships only what already passed vet/build/test on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Take the version from go.mod rather than pinning it here, so the
          # toolchain the CI uses is the one the module actually declares.
          go-version-file: go.mod
          cache: true

      # gofmt exits 0 even when it reformats, so the check is "did it want to
      # change anything" — the only form of it that can fail a build.
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo '::error::run gofmt -w .'; exit 1; }

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -cover
