name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins the SDK when the project ships one; without it this
          # falls back to the latest channel the runner has.
          global-json-file: global.json
        continue-on-error: true

      - run: dotnet restore
      - run: dotnet format --verify-no-changes
      # --no-restore because restore already ran; repeating it hides a broken
      # restore behind a passing build.
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --verbosity normal
