blank_issues_enabled: false
contact_links:
  - name: Question or discussion
    url: https://github.com/{{owner}}/{{projectName}}/discussions
    about: For questions and ideas, use Discussions instead of an issue.
  - name: Security vulnerability
    url: https://github.com/{{owner}}/{{projectName}}/security/advisories/new
    about: Report vulnerabilities privately — never in a public issue.
