[project]
name = "{{projectName}}"
version = "0.1.0"
requires-python = ">=3.12"

# CONVENTIONS.md rule 5 asks for a `database:seed` task. Python has no task
# runner in the standard toolchain — `[project.scripts]` only produces a command
# once the project is pip-installed, and this template is run from a checkout —
# so the rule is broken openly here: the loader is one command, run directly.
#
#   python database/fill_demo_data.py [--reset]
#
# See database/README.md.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
