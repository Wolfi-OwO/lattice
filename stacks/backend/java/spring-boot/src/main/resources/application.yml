spring:
  application:
    name: {{projectName}}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/{{projectName}}}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    # Flyway owns the schema. `validate` makes a drifted entity fail at boot
    # instead of silently mutating the database.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:database/migration

server:
  port: ${PORT:{{port}}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # Override in every real environment. HS256 needs >= 32 bytes.
    secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-bytes}
    expiry: ${JWT_EXPIRY:1h}

logging:
  level:
    {{javaPackage}}: DEBUG
