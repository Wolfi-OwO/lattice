spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-that-is-at-least-32-bytes-long
    expiry: 1h
  shutdown:
    # The suite should not pay for the drain window. Production keeps the default.
    grace: 0s
