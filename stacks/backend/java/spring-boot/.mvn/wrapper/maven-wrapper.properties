# The Maven Wrapper, in its script-only distribution.
#
# distributionType=only-script is what makes this possible without committing a
# binary: mvnw downloads and verifies Maven itself, so there is no
# maven-wrapper.jar in the repository. STRUCTURE.md refuses to ship binaries and
# that rule stands — this is how a Java project ships its build requirement
# instead of assuming you already have the right Maven on PATH.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip
